name: Release and Deploy

on:
  push:
    branches: [master, cuanto-llevo-gastao]
  pull_request:
    branches: [master, cuanto-llevo-gastao]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

# Scope concurrency per workflow + ref so runs on different branches/PRs do
# not cancel each other. Without this, the single static "pages" group caused
# a new PR's run to cancel another open PR's in-progress CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.sr.outputs.new_release_published }}
      version: ${{ steps.sr.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Semantic Release
        id: sr
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/git
            @semantic-release/changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_and_deploy:
    needs: release
    if: always() && needs.release.result != 'cancelled' && (needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: github-pages
    # Serialize actual Pages deployments without cancelling an in-flight one.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (Nuxt generate)
        run: |
          export NUXT_PUBLIC_APP_VERSION="${{ needs.release.outputs.version || '1.0.0' }}"
          if [ -n "${{ vars.NUXT_APP_BASE_URL }}" ]; then
            # Ensure leading and trailing slashes
            BASE_URL="${{ vars.NUXT_APP_BASE_URL }}"
            [[ "${BASE_URL}" != /* ]] && BASE_URL="/${BASE_URL}"
            [[ "${BASE_URL}" != */ ]] && BASE_URL="${BASE_URL}/"
            export NUXT_APP_BASE_URL="$BASE_URL"
          else
            export NUXT_APP_BASE_URL="/${{ github.event.repository.name || 'cuanto-llevo-gastao' }}/"
          fi
          echo "Building with NUXT_APP_BASE_URL=$NUXT_APP_BASE_URL"
          npm run generate
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NITRO_PRESET: github-pages
          NUXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NUXT_PUBLIC_GOOGLE_CLIENT_ID }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build (Nuxt generate)
        run: |
          export NUXT_PUBLIC_APP_VERSION="0.0.0-pr"
          if [ -n "${{ vars.NUXT_APP_BASE_URL }}" ]; then
            # Ensure leading and trailing slashes
            BASE_URL="${{ vars.NUXT_APP_BASE_URL }}"
            [[ "${BASE_URL}" != /* ]] && BASE_URL="/${BASE_URL}"
            [[ "${BASE_URL}" != */ ]] && BASE_URL="${BASE_URL}/"
            export NUXT_APP_BASE_URL="$BASE_URL"
          else
            export NUXT_APP_BASE_URL="/${{ github.event.repository.name || 'cuanto-llevo-gastao' }}/"
          fi
          npm run generate
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NITRO_PRESET: github-pages
